<!doctype html>
<html>
	<head>
		<title>Offline noise generator</title>
	</head>
	<body>
	  <h1>Offline noise generator</h1>
	  <h3>Light Rain</h3>
	  <audio controls loop>
		<source src="audio/light_rain.ogg" />
	  </audio>
	  <h3>Heavy Rain</h3>
	  <audio controls loop>
		<source src="audio/heavy_rain.ogg">
	  </audio>
	  <h3>Cafe</h3>
	  <audio controls loop>
		<source src="audio/cafe.ogg" />
	  </audio>
	  <h3>Fire</h3>
	  <audio controls loop>
		<source src="audio/fire.ogg" />
	  </audio>
	  <h3>Birds</h3>
	  <audio controls loop>
		<source src="audio/birds.ogg" />
	  </audio>
	</body>
</html>
